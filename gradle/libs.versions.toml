[versions]
agp = "8.6.0"
kotlin = "1.9.0"
coreKtx = "1.13.0"
junit = "4.13.2"
junitVersion = "1.1.5"
espressoCore = "3.5.1"
appcompat = "1.6.1"
material = "1.11.0"
activity = "1.8.0"
constraintlayout = "2.1.4"
firebase = "32.7.4"
google-services = "4.4.0"
gms = "21.1.0"
biometric = "1.1.0"
security-crypto = "1.1.0-alpha06"
play-services-maps = "18.2.0"
localbroadcastmanager = "1.1.0"
osmdroid = "6.1.18"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
androidx-activity = { group = "androidx.activity", name = "activity", version.ref = "activity" }
androidx-constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintlayout" }

# Firebase
firebase-bom = { group = "com.google.firebase", name = "firebase-bom", version.ref = "firebase" }
firebase-firestore = { group = "com.google.firebase", name = "firebase-firestore" }
firebase-storage = { group = "com.google.firebase", name = "firebase-storage" }
firebase-auth = { group = "com.google.firebase", name = "firebase-auth" }
firebase-analytics = { group = "com.google.firebase", name = "firebase-analytics" }

# Location Services
play-services-location = { group = "com.google.android.gms", name = "play-services-location", version.ref = "gms" }
androidx-biometric = { group = "androidx.biometric", name = "biometric", version.ref = "biometric" }
androidx-security-crypto = { group = "androidx.security", name = "security-crypto", version.ref = "security-crypto" }
play-services-maps = { group = "com.google.android.gms", name = "play-services-maps", version.ref = "play-services-maps" }
androidx-localbroadcastmanager = { group = "androidx.localbroadcastmanager", name = "localbroadcastmanager", version.ref = "localbroadcastmanager" }
osmdroid-android = { group = "org.osmdroid", name = "osmdroid-android", version.ref = "osmdroid" }

# Image Loading
glide = "com.github.bumptech.glide:glide:4.16.0"
glide-compiler = "com.github.bumptech.glide:compiler:4.16.0"

# Additional AndroidX
androidx-recyclerview = "androidx.recyclerview:recyclerview:1.3.2"
androidx-viewpager2 = "androidx.viewpager2:viewpager2:1.0.0"
androidx-cardview = "androidx.cardview:cardview:1.0.0"
androidx-lifecycle-viewmodel = "androidx.lifecycle:lifecycle-viewmodel:2.6.2"
androidx-lifecycle-livedata = "androidx.lifecycle:lifecycle-livedata:2.6.2"
androidx-lifecycle-runtime = "androidx.lifecycle:lifecycle-runtime:2.6.2"
androidx-navigation-fragment = "androidx.navigation:navigation-fragment:2.7.5"
androidx-navigation-ui = "androidx.navigation:navigation-ui:2.7.5"

# Room (banco local)
androidx-room-runtime = "androidx.room:room-runtime:2.6.1"
androidx-room-compiler = "androidx.room:room-compiler:2.6.1"

# Retrofit
retrofit = "com.squareup.retrofit2:retrofit:2.10.0"
okhttp = "com.squareup.okhttp3:okhttp:4.11.0"

# JSON
gson = "com.google.code.gson:gson:2.10.1"

# Camera
androidx-camera-core = "androidx.camera:camera-core:1.3.1"
androidx-camera-camera2 = "androidx.camera:camera-camera2:1.3.1"
androidx-camera-lifecycle = "androidx.camera:camera-lifecycle:1.3.1"
androidx-camera-view = "androidx.camera:camera-view:1.3.1"

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
google-gms-google-services = { id = "com.google.gms.google-services", version.ref = "google-services" }

[bundles]